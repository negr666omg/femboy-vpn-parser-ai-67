name: Build SubWatch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Test current checkout
        run: go mod tidy && git diff -- go.mod go.sum && go test ./... && go vet ./...
      - name: Build Linux amd64
        run: go build -trimpath -ldflags='-s -w' -o sw ./cmd/subwatch
      - uses: actions/upload-artifact@v4
        with:
          name: sw-linux-amd64
          path: sw
          if-no-files-found: error
          retention-days: 30
