name: Build SubWatch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Extract source
        run: mkdir -p src && tar -xzf subwatch-source.tar.gz -C src
      - name: Test
        working-directory: src
        run: go test ./... && go vet ./...
      - name: Build Linux amd64
        working-directory: src
        run: go build -trimpath -ldflags='-s -w' -o ../subwatch-linux-amd64 ./cmd/subwatch
      - uses: actions/upload-artifact@v4
        with:
          name: subwatch-linux-amd64
          path: subwatch-linux-amd64
          if-no-files-found: error
          retention-days: 30
